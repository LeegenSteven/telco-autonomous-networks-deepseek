[project]
name = "agents"
version = "0.1.0"
description = "DeepSeek-powered local telco anomaly detection and RCA agents"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3.0",
    "google-adk>=1.22.0",
    "litellm>=1.75.0",
    "pydantic-settings>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[tool.setuptools.packages.find]
include = [
    "incident_detector*",
    "root_cause_analysis*",
    "telco_local*",
]
